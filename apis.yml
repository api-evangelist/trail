aid: trail
name: Trail
description: Trail is a digital checklist and work management platform for hospitality and leisure teams,
  now part of The Access Group (originally Trailsuite Ltd, a Seedcamp portfolio company). Trail digitises
  daily operations — food safety checks, brand standards, compliance logs and task management — across
  sites, and publishes a set of API-key-secured public APIs (Task Reports, Task Instances, Task Templates,
  Sites, Areas, Tags, Scores) plus an OAuth2-secured Evo API, documented with OpenAPI at web.trailapp.com/api-docs.
